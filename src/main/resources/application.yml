server:
  port: 8085

spring:
  application:
    name: hotel-booking-api
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost;instanceName=SQLEXPRESS;databaseName=DoAnHotelParkingDb;encrypt=false;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:12345678}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    issuer: DoAn.HotelParking
    audience: DoAn.HotelParking.Client
    secret-key: ${JWT_SECRET_KEY:change-me-before-production-please-use-env-secret-key}
    access-token-expiration-minutes: 60
  minio:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket-name: hotel-images
    public-base-url: http://localhost:9000
    auto-create-bucket: true
  firebase:
    credentials-path: firebase/hotelapp-63196-firebase-adminsdk-fbsvc-a126f141e7.json
    project-id: hotelapp-63196
  google:
    client-id: ${GOOGLE_CLIENT_ID:883824205385-182f65ondho5qnima9ladd5j7qk2b40h.apps.googleusercontent.com}
  ai-agent:
    base-url: ${AI_AGENT_BASE_URL:http://localhost:8000}
  payment:
    vnpay:
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8085/api/payments/vnpay-return}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
