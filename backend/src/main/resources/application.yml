server:
  port: 8080

spring:
  application:
    name: hotel-booking-api
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:sqlserver://localhost:1433;databaseName=DoAnHotelParkingDb;encrypt=true;trustServerCertificate=true}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        physical_naming_strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  jwt:
    issuer: DoAn.HotelParking
    audience: DoAn.HotelParking.Client
    secret-key: ${APP_JWT_SECRET_KEY:DoAn.HotelParking.Super.Secret.Key.2026}
    access-token-expiration-minutes: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:60}
  minio:
    endpoint: ${APP_MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${APP_MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${APP_MINIO_SECRET_KEY:minioadmin}
    bucket-name: ${APP_MINIO_BUCKET_NAME:hotel-images}
    public-base-url: ${APP_MINIO_PUBLIC_BASE_URL:http://localhost:9000}
    auto-create-bucket: ${APP_MINIO_AUTO_CREATE_BUCKET:true}
  firebase:
    credentials-path: ${APP_FIREBASE_CREDENTIALS_PATH:firebase/hotelapp-63196-firebase-adminsdk-fbsvc-a126f141e7.json}
    project-id: ${APP_FIREBASE_PROJECT_ID:hotelparking-9c7ce}
  google:
    client-id: ${GOOGLE_CLIENT_ID:883824205385-182f65ondho5qnima9ladd5j7qk2b40h.apps.googleusercontent.com}
  ai-agent:
    base-url: ${AI_AGENT_BASE_URL:http://localhost:8000}
  payment:
    vnpay:
      pay-url: ${VNPAY_PAY_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/payments/vnpay-return}
      tmn-code: ${VNPAY_TMN_CODE:}
      hash-secret: ${VNPAY_HASH_SECRET:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    mail:
      enabled: ${MAIL_HEALTH_ENABLED:false}
    minio:
      enabled: ${MINIO_HEALTH_ENABLED:false}
    firebase:
      enabled: ${FIREBASE_HEALTH_ENABLED:false}

